syntax = "proto3";
package ecommerce.order;

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (Order);
  rpc ListOrders (ListOrdersRequest) returns (OrderList);
  rpc GetOrder (GetOrderRequest) returns (Order);
}

message OrderItemInput {
  int32 pid = 1;
  int32 qty = 2;
}
message OrderItem {
  int32 pid = 1;
  int32 qty = 2;
  double unit_price = 3;
}

message CreateOrderRequest {
  int32 uid = 1;                       // lấy từ JWT ở Gateway, không tin client
  repeated OrderItemInput items = 2;
}

message Order {
  int32 oid = 1;
  int32 uid = 2;
  double discount = 3;                 // phần trăm
  double total_amount = 4;
  repeated OrderItem items = 5;
  string shipment_status = 6;          // "PENDING"; shipid không có vì tạo bất đồng bộ
}
message OrderList { repeated Order items = 1; }

message ListOrdersRequest {
  int32 requester_uid = 1;
  string requester_role = 2;           // admin xem được rộng hơn
}
message GetOrderRequest {
  int32 oid = 1;
  int32 requester_uid = 2;
  string requester_role = 3;           // khách chỉ xem đơn của mình
}